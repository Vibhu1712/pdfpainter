name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      # until pdfsieve is on PyPI, take it from GitHub (remove this line after the first release)
      - run: pip install "pdfsieve @ git+https://github.com/YOUR-GITHUB-USER/pdfsieve"
      - run: pip install -e ".[test]"
      - run: pip install pypdfium2
      - run: pytest -q
